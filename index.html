<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CRMJSWJVQF"></script>
<script src="gtag.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>benchmark · 游戏与视频展示</title>
<style>
  :root{
    --bg:#0b0f16;
    --card:#131a24;
    --line:#212c3a;
    --text:#e8eef6;
    --muted:#8b9bb0;
    --accent:#4f9dff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    padding:48px 20px 64px;
    background:radial-gradient(1200px 600px at 20% -10%,#16202e 0%,var(--bg) 60%);
    color:var(--text);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto}
  header{margin-bottom:40px}
  h1{font-size:28px;margin:0 0 8px;letter-spacing:.5px}
  .sub{margin:0;color:var(--muted);font-size:15px}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
  }
  .card{
    display:flex;flex-direction:column;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    transition:border-color .2s,transform .2s,box-shadow .2s;
  }
  .card:hover{
    border-color:#31465f;
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  .card-head{
    display:flex;align-items:center;gap:12px;
    padding:20px 20px 16px;
    border-bottom:1px solid var(--line);
  }
  .cover{
    flex:none;
    width:44px;height:44px;
    display:grid;place-items:center;
    border-radius:12px;
    background:linear-gradient(135deg,var(--accent),#8b5cf6);
    font-size:20px;
  }
  .title{font-size:17px;font-weight:600;margin:0}
  .desc{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .intro{
    margin:0;
    padding:14px 20px 4px;
    font-size:14px;
    line-height:1.7;
    color:#b7c4d4;
  }
  .links{list-style:none;margin:0;padding:8px}
  .links a{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 12px;
    border-radius:10px;
    color:var(--text);
    font-size:14px;
    text-decoration:none;
  }
  .links a:hover{background:#1c2634;color:var(--accent)}
  .links a::after{content:"›";color:var(--muted);font-size:18px;line-height:1}
  .links a:hover::after{color:var(--accent)}
  .count{
    margin:0;
    padding:0 20px 16px;
    font-size:12px;
    color:var(--muted);
  }
  footer{margin-top:40px;font-size:13px;color:var(--muted)}
  @media (max-width:480px){
    body{padding:32px 16px 48px}
    h1{font-size:22px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>benchmark</h1>
    <p class="sub">点击进入，即可试玩。</p>
  </header>
  <div class="grid" id="grid"></div>
  <footer>由 Cloudflare Pages 托管</footer>
</div>
<script>
const GAMES = [
  {
    dir: "city-dash",
    name: "City Dash",
    desc: "城市狂奔",
    emoji: "🏙️",
    intro: "一条 endless runner：三条跑道左右切换、跳跃躲避卡车与路障，越跑越快。手机用屏幕按钮，电脑用 A/D 与空格。撞卡车扣命，跳过锥桶和路障可以拿金币。",
    links: [
      { label: "glm-5.3-flash", href: "city-dash/glm-5.3-flash.html" },
      { label: "deepseek-4.1-flash", href: "city-dash/deepseek-4.1-flash.html" },
      { label: "qwen3.8-flash", href: "city-dash/qwen3.8-flash.html" }
    ]
  }
];

document.getElementById("grid").innerHTML = GAMES.map(function (g) {
  const items = g.links.map(function (l) {
    return '<li><a href="' + l.href + '">' + l.label + "</a></li>";
  }).join("");
  return (
    '<section class="card">' +
      '<div class="card-head">' +
        '<div class="cover">' + (g.emoji || "🎮") + "</div>" +
        "<div><h2 class=\"title\">" + g.name + "</h2>" +
        '<p class="desc">' + (g.desc || "") + "</p></div>" +
      "</div>" +
      (g.intro ? '<p class="intro">' + g.intro + "</p>" : "") +
      '<ul class="links">' + items + "</ul>" +
      '<p class="count">' + g.links.length + " 个版本</p>" +
    "</section>"
  );
}).join("");
</script>
</body>
</html>
