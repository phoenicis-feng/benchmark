<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111e29"><title>江湾市 · 城市经营模拟</title><style>/* STYLES */</style></head>
<body>
<header><div class="brand"><span class="brandmark">▥</span><div><strong>江湾市</strong><small>RIVERBEND CITY</small></div><span class="tag">城市经营模拟</span></div><div class="header-actions"><span class="live-dot"></span><span id="date">第 1 年 · 1 月</span><button id="help" class="quiet">玩法指南 <kbd>?</kbd></button><button id="save" class="quiet">保存</button><button id="load" class="quiet">读取</button><button id="more" class="quiet">···</button></div></header>
<section class="metrics" aria-label="城市概况"><div><small>城市资金</small><strong id="cash">¥ 28,000</strong><span id="balance"></span></div><div><small>常住人口</small><strong id="population">75</strong><span id="popDelta"></span></div><div><small>就业率</small><strong id="employment">100%</strong><span id="jobs"></span></div><div><small>市民幸福度</small><strong id="happiness">70</strong><span id="happyLabel"></span></div><div><small>道路拥堵</small><strong id="traffic">0%</strong><span id="commute"></span></div><div><small>基础设施</small><strong id="utility">水电充足</strong><span id="capacity"></span></div></section>
<main>
<aside class="tools"><div class="section-head"><span>城市规划</span><small>BUILD YOUR CITY</small></div><div id="toolList"></div><div class="demand-box"><div class="section-head"><span>分区需求</span><small>RCI</small></div><div id="demand"></div><p>正需求吸引发展，负需求表示供给过剩。</p></div><button id="undo" class="wide quiet">↶ 撤销本月最后一次建造</button><div class="tool-hint">拖动建造道路 / 分区<br>滚轮缩放 · 右键或空格拖动地图</div></aside>
<section class="map-panel" aria-label="城市地图"><canvas id="map" tabindex="0" aria-label="可交互城市地图"></canvas><div class="map-top"><span class="map-label"><i></i> 江湾区域 <small>36 × 30</small></span><select id="overlay" aria-label="地图图层"><option value="normal">城市视图</option><option value="traffic">交通流量</option><option value="power">电力覆盖</option><option value="water">供水覆盖</option><option value="pollution">污染分布</option><option value="fire">消防覆盖</option><option value="happiness">幸福度</option></select></div><div class="map-controls"><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">−</button><button id="center" aria-label="重置视角">⌖</button></div><div id="mapTip" class="map-tip">选择工具后点击地图建造</div><div class="map-bottom"><div class="time-controls"><button id="pause" title="空格暂停">Ⅱ</button><button data-speed="1" class="active">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><span>每月结算</span><button id="step" title="推进一个月">下月 →</button></div><span id="saveStatus">自动保存已开启</span></div><div id="toast" role="status"></div></section>
<aside class="city-panel"><div class="panel-tabs"><button data-panel="overview" class="active">概览</button><button data-panel="budget">财政</button><button data-panel="history">趋势</button></div><div id="panelContent"></div><div class="inspector"><div class="section-head"><span>地块检查</span><small id="coords">点击地块</small></div><div id="inspection"><p class="muted">用「检查」工具查看建筑的道路、水电、人口与通勤情况。</p></div></div></aside>
</main>
<footer><span><i class="status-dot"></i><b id="cityStatus">小镇初成</b> <span class="muted">每个选择，都在塑造这座城市。</span></span><span>离线可玩 · 本地存档 <kbd>Space</kbd> 暂停 <kbd>Esc</kbd> 检查</span></footer>
<dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="关闭">×</button></div><div id="modalBody"></div></dialog><input type="file" accept="application/json,.json" id="importFile" hidden>
<script>/* ENGINE */</script><script>/* UI */</script>
</body></html>
