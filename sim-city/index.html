<body>
<header><div class="brand"><span class="brandmark">▥</span><div><strong>江湾市</strong><small>RIVERBEND CITY</small></div><span class="tag">城市经营模拟</span></div><div class="header-actions"><span class="live-dot"></span><span id="date">第 1 年 · 1 月</span><button id="help" class="quiet">玩法指南 <kbd>?</kbd></button><button id="save" class="quiet">保存</button><button id="load" class="quiet">读取</button><button id="more" class="quiet">···</button></div></header>
<section class="metrics" aria-label="城市概况"><div><small>城市资金</small><strong id="cash">¥ 28,000</strong><span id="balance"></span></div><div><small>常住人口</small><strong id="population">75</strong><span id="popDelta"></span></div><div><small>就业率</small><strong id="employment">100%</strong><span id="jobs"></span></div><div><small>市民幸福度</small><strong id="happiness">70</strong><span id="happyLabel"></span></div><div><small>道路拥堵</small><strong id="traffic">0%</strong><span id="commute"></span></div><div><small>基础设施</small><strong id="utility">水电充足</strong><span id="capacity"></span></div></section>
<main>
<aside class="tools"><div class="section-head"><span>城市规划</span><small>BUILD YOUR CITY</small></div><div id="toolList"></div><div class="demand-box"><div class="section-head"><span>分区需求</span><small>RCI</small></div><div id="demand"></div><p>正需求吸引发展，负需求表示供给过剩。</p></div><button id="undo" class="wide quiet">↶ 撤销本月最后一次建造</button><div class="tool-hint">拖动建造道路 / 分区<br>滚轮缩放 · 右键或空格拖动地图</div></aside>
<section class="map-panel" aria-label="城市地图"><canvas id="map" tabindex="0" aria-label="可交互城市地图"></canvas><div class="map-top"><span class="map-label"><i></i> 江湾区域 <small>36 × 30</small></span><select id="overlay" aria-label="地图图层"><option value="normal">城市视图</option><option value="traffic">交通流量</option><option value="power">电力覆盖</option><option value="water">供水覆盖</option><option value="pollution">污染分布</option><option value="fire">消防覆盖</option><option value="happiness">幸福度</option></select></div><div class="map-controls"><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">−</button><button id="center" aria-label="重置视角">⌖</button></div><div id="mapTip" class="map-tip">选择工具后点击地图建造</div><div class="map-bottom"><div class="time-controls"><button id="pause" title="空格暂停">Ⅱ</button><button data-speed="1" class="active">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><span>每月结算</span><button id="step" title="推进一个月">下月 →</button></div><span id="saveStatus">自动保存已开启</span></div><div id="toast" role="status"></div></section>
<aside class="city-panel"><div class="panel-tabs"><button data-panel="overview" class="active">概览</button><button data-panel="budget">财政</button><button data-panel="history">趋势</button></div><div id="panelContent"></div><div class="inspector"><div class="section-head"><span>地块检查</span><small id="coords">点击地块</small></div><div id="inspection"><p class="muted">用「检查」工具查看建筑的道路、水电、人口与通勤情况。</p></div></div></aside>
</main>
<footer><span><i class="status-dot"></i><b id="cityStatus">小镇初成</b> <span class="muted">每个选择，都在塑造这座城市。</span></span><span>离线可玩 · 本地存档 <kbd>Space</kbd> 暂停 <kbd>Esc</kbd> 检查</span></footer>

<script>(function(root){
'use strict';
const W=36,H=30,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const TYPES={
 road:{name:'道路',cost:35,upkeep:.35},bridge:{name:'桥梁',cost:220,upkeep:2},
 residential:{name:'住宅区',cost:70,upkeep:0,color:'#62c69c',caps:[0,40,85,150]},
 commercial:{name:'商业区',cost:90,upkeep:0,color:'#63afe1',caps:[0,20,45,85]},
 industrial:{name:'工业区',cost:110,upkeep:0,color:'#efbc65',caps:[0,35,70,130]},
 power:{name:'发电站',cost:2600,upkeep:75,capacity:1500},water:{name:'供水站',cost:1800,upkeep:50,capacity:1800},
 park:{name:'公园',cost:450,upkeep:8,radius:5},fire:{name:'消防站',cost:1500,upkeep:40,radius:8},
 clinic:{name:'诊所',cost:1800,upkeep:50,radius:7},school:{name:'学校',cost:1600,upkeep:45,radius:7},
 bulldoze:{name:'拆除',cost:20,upkeep:0}
};
const ZONES=['residential','commercial','industrial'];
const road=t=>t && (t.type==='road'||t.type==='bridge');
class City{
 constructor(seed=721,starter=true){
  this.version=1;this.seed=seed>>>0;this.month=0;this.cash=28000;this.tax=9;this.funding={power:100,water:100,services:100,roads:100};
  this.loans=[];this.history=[];this.messages=[];this.goals=[];this.lastAction=null;this.disasters=true;
  this.tiles=Array.from({length:W*H},(_,i)=>{let x=i%W,y=Math.floor(i/W),river=26+Math.round(Math.sin(y/5)*1.2);return {terrain:Math.abs(x-river)<=1?'water':(this.random()<.19?'forest':'grass'),type:null,level:0,pop:0,damage:0};});
  this.tiles[14*W]={terrain:'grass',type:'road',level:0,pop:0,damage:0,gateway:true};
  if(starter)this.starter();this.recompute();this.log('欢迎来到江湾市。连接道路、规划分区，让城市慢慢成长。','info');
 }
 random(){this.seed=(Math.imul(this.seed,1664525)+1013904223)>>>0;return this.seed/4294967296;}
 neighbors(i){let x=i%W,y=Math.floor(i/W),a=[];if(x)a.push(i-1);if(x<W-1)a.push(i+1);if(y)a.push(i-W);if(y<H-1)a.push(i+W);return a;}
 starter(){
  const put=(x,y,type,level=0,pop=0)=>{this.tiles[y*W+x]={terrain:'grass',type,level,pop,damage:0};};
  for(let x=1;x<=18;x++)put(x,14,'road');for(let y=8;y<=21;y++)put(9,y,'road');
  for(let x=4;x<=14;x++)put(x,10,'road');for(let x=4;x<=17;x++)put(x,19,'road');
  [[5,11],[6,11],[7,11],[8,11],[10,11],[11,11]].forEach(([x,y],k)=>put(x,y,'residential',1,k<3?25:0));
  [[5,13],[7,13],[11,13]].forEach(([x,y])=>put(x,y,'commercial',1));
  [[13,18],[14,18],[15,18],[16,18]].forEach(([x,y])=>put(x,y,'industrial',1));
  put(17,15,'power');put(18,13,'water');put(8,9,'park');put(10,9,'clinic');put(8,16,'fire');
 }
 log(text,kind='info'){this.messages.unshift({month:this.month,text,kind});this.messages=this.messages.slice(0,40);}
 build(x,y,type){
  if(!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0||x>=W||y>=H||!Object.hasOwn(TYPES,type))return {ok:false,reason:'无效位置或建筑'};
  let i=y*W+x,t=this.tiles[i];if(t.gateway)return {ok:false,reason:'区域入口不能拆除'};
  if(type==='bulldoze'){
   if(!t.type&&t.terrain!=='forest')return {ok:false,reason:'这里没有可拆除的建筑'};
   if(this.cash<20)return {ok:false,reason:'拆除需要 ¥20'};
   this.lastAction={i,before:{...t},cash:this.cash,month:this.month};this.cash-=20;this.tiles[i]={terrain:t.terrain==='forest'?'grass':t.terrain,type:null,level:0,pop:0,damage:0};this.recompute();return {ok:true};
  }
  if(t.type)return {ok:false,reason:'请先拆除现有建筑'};
  if((t.terrain==='water')!==(type==='bridge'))return {ok:false,reason:t.terrain==='water'?'水面只能建桥梁':'桥梁需要建在水面'};
  let cost=TYPES[type].cost+(t.terrain==='forest'?15:0);if(this.cash<cost)return {ok:false,reason:'资金不足'};
  this.lastAction={i,before:{...t},cash:this.cash,month:this.month};this.cash-=cost;t.type=type;t.level=0;t.pop=0;t.damage=0;this.recompute();return {ok:true,cost};
 }
 undo(){let a=this.lastAction;if(!a||a.month!==this.month)return false;this.tiles[a.i]=a.before;this.cash=a.cash;this.lastAction=null;this.recompute();return true;}
 network(){
  this.components=[];this.sources={};this.comp=new Int32Array(W*H).fill(-1);this.access=new Int32Array(W*H).fill(-1);this.adjRoad=new Int32Array(W*H).fill(-1);
  this.tiles.forEach((t,i)=>{if(!road(t)||this.comp[i]>=0)return;let id=this.components.length,list=[i];this.comp[i]=id;for(let k=0;k<list.length;k++)for(let n of this.neighbors(list[k]))if(road(this.tiles[n])&&this.comp[n]<0){this.comp[n]=id;list.push(n);}this.components.push({roads:list,gateway:list.some(n=>this.tiles[n].gateway),power:0,water:0,demandP:0,demandW:0});});
  this.tiles.forEach((t,i)=>{if(!t.type||road(t))return;(this.sources[t.type]??=[]).push(i);let ns=this.neighbors(i).filter(n=>road(this.tiles[n]));ns.sort((a,b)=>Number(this.components[this.comp[b]].gateway)-Number(this.components[this.comp[a]].gateway));if(ns.length){this.adjRoad[i]=ns[0];this.access[i]=this.comp[ns[0]];}});
 }
 utilities(){
  for(let c of this.components){c.power=0;c.water=0;c.demandP=0;c.demandW=0;}
  this.tiles.forEach((t,i)=>{let c=this.components[this.access[i]];t.power=0;t.water=0;if(!c||!t.type||road(t)||t.damage)return;
   if(t.type==='power')c.power+=1500*this.funding.power/100;if(t.type==='water')c.water+=1800*this.funding.water/100;
   let load=t.type==='residential'?Math.max(6,t.pop*.65):ZONES.includes(t.type)?Math.max(8,this.capacity(t)*.65):8;
   c.demandP+=load;c.demandW+=load*(t.type==='industrial'?1.4:1);
  });
  this.tiles.forEach((t,i)=>{let c=this.components[this.access[i]];if(c&&!t.damage){t.power=clamp(c.power/Math.max(1,c.demandP),0,1);t.water=clamp(c.water/Math.max(1,c.demandW),0,1);}});
 }
 capacity(t){return ZONES.includes(t.type)&&!t.damage?TYPES[t.type].caps[t.level]:0;}

const guide=`<p>你是江湾市的市长。让人口、产业与设施保持平衡，建设能长期运转的城市。每个游戏月约 3 秒，可暂停规划。</p><h3>从一条路开始</h3><ol><li>道路必须连接地图西侧的区域入口。住宅、岗位和设施需要紧邻道路。河面用桥梁连接。</li><li>建设发电站与供水站：水电沿同一个道路网络供应。容量不足会停供、减少有效岗位、阻碍迁入。</li><li>规划住宅、商业与工业。住宅入住需要可达岗位；商业和工业吸纳居民就业。工商业只有实际雇员才产生税收。</li><li>用公园、学校、诊所和消防站改善生活。工业和发电站会污染周围住宅，适当保持距离。</li><li>关注月度结余，留出扩建资金。完成四个城市目标获得奖励，之后仍可持续经营。</li></ol><h3>城市如何运行</h3><p>55% 的居民是劳动力。每月按最短道路路径分配工作，往返车流叠加到沿途道路。每格道路默认承载 60 单位车流，超过后形成拥堵，降低幸福度，并使工商税收入最多减少 25%。超过 12 格的长距离通勤也会降低幸福度。增建分散通勤的支路、让岗位靠近住宅，或提高道路预算。</p><p>低、中、高密度住宅容纳 40 / 85 / 150 人；商业提供 20 / 45 / 85 岗位；工业提供 35 / 70 / 130 岗位。每 6 个月检查升级：入住率或岗位利用率超过 80% / 75%，需求为正；住宅还需幸福度 > 64、教育覆盖 > 20%。建筑由开发商自动发展，不收取升级费用。</p><p>水电在道路网络内按比例分配。发电站基础容量 1,500，供水站 1,800；住宅随实际人口耗用，产业按岗位容量耗用。公共服务按距离衰减，并受道路连接、水电与服务预算影响。覆盖比例按居民人数加权。</p><p>居民税 = 人口 × 税率 × 0.15；工商税 = 实际雇员 × 税率 × 0.21 × (1 − 拥堵比例 × 0.25)。税率 3–18%，高税率降低幸福度与迁入。设施维护、道路维护、贷款每月扣除。透支后居民额外流失，可缩减支出、拆除冗余设施或贷款恢复。</p><p>消防覆盖减少火灾概率。受损建筑停用 3 个月并自动修复，住宅居民撤离城市。火灾可在 ··· 菜单关闭。不会离线推进模拟。</p><h3>操作与保存</h3><p>点击建造；按住拖动连续铺设道路、分区或拆除。滚轮 / ＋− 缩放；检查工具拖动、右键拖动或按住空格拖动地图；空格轻按暂停，Esc 切换检查。R 道路、H 住宅、C 商业、I 工业、B 拆除。方向键移动视角。快捷键在弹窗中停用。</p><p>「撤销」恢复本月最后一次建造及费用。每 3 个模拟月和离开页面时自动保存；也可手动保存。「读取」加载当前浏览器存档，··· 可导入导出 JSON 备份。直接打开 HTML 的存储权限因浏览器而异，建议导出备份。</p><h3>经营建议</h3><p>初始小镇已铺设部分设施，仍需等待居民迁入后实现盈利。先增加住宅，再按需求扩充岗位；别过早铺满高维护设施。达到 300 人后布局学校与多条通勤路线，为密度升级做准备。</p>`;

  let hash=(x*17+y*31)%9,color=t.terrain==='water'?['#3b828d','#3c8590','#3e8692'][hash%3]:['#638e72','#659475','#608b6e','#689576'][hash%4];diamond(px,py,color,t.terrain==='water'?'#51969b':'#72977c');
  if(t.terrain==='water'){ctx.strokeStyle='#8ad0c040';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(px-8,py+11+Math.sin(now/1200+x)*2);ctx.lineTo(px+6,py+16+Math.sin(now/1200+x)*2);ctx.stroke();}
  if(['road','bridge'].includes(t.type)){diamond(px,py+1,t.type==='bridge'?'#a0a898':'#566669');ctx.strokeStyle='#84918a';ctx.lineWidth=.7;let neigh=city.neighbors(i).filter(n=>['road','bridge'].includes(city.tiles[n].type));for(let n of neigh){let nx=n%W,ny=Math.floor(n/W);ctx.beginPath();ctx.moveTo(px,py+11);ctx.lineTo(px+(nx-x-ny+y)*11,py+11+(nx-x+ny-y)*5.5);ctx.stroke();}if(t.type==='bridge'){ctx.strokeStyle='#c4c6ad';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px-17,py+10);ctx.lineTo(px,py+18);ctx.lineTo(px+17,py+10);ctx.stroke();}if(t.gateway){ctx.fillStyle='#def3c7';ctx.font='bold 8px sans-serif';ctx.fillText('入口',px-7,py+11);}if(city.traffic[i]>0&&overlay==='normal'&&neigh.length){let n=neigh[(i+Math.floor(now/1800))%neigh.length],p=(now/1500+i*.137)%1,nx=n%W,ny=Math.floor(n/W);ctx.fillStyle=i%2?'#f6d592':'#c3e2d7';ctx.fillRect(px+(nx-x-ny+y)*18*(p-.5)-1,py+10+(nx-x+ny-y)*9*(p-.5)-1,3,2);}}
  else if(t.type){let pyc=py+11,level=t.level;if(['residential','commercial','industrial'].includes(t.type)){
    if(!level){diamond(px,py+1,TYPES[t.type].color+'80');ctx.strokeStyle=TYPES[t.type].color;ctx.lineWidth=1;ctx.strokeRect(px-4,py+8,8,5);}
    else if(t.type==='residential'){block(px-2,pyc,10,5,10+level*12,'#d9e3cd','#91b7a3','#6b9386');block(px-2,pyc-10-level*12,11,5,2,'#5b9b80','#468567','#39725a');windows(px-2,pyc,level, '#e5d8a0');}
    else if(t.type==='commercial'){block(px,pyc,11,6,15+level*15,'#bce0e3','#6eacb8','#538c9b');windows(px,pyc,level+1,'#b9dde0');}
    else{block(px,pyc+2,13,7,11+level*3,'#e5c791','#b39b76','#907e60');block(px+5,pyc-2,2,1,22+level*3,'#d2b99b','#ab8d74','#856c58');ctx.fillStyle='#d7e2db40';ctx.beginPath();ctx.arc(px+4+Math.sin(now/1100+i)*3,pyc-27-level*3,4,0,Math.PI*2);ctx.fill();}
  }else if(t.type==='park'){diamond(px,py+1,'#78a77c');tree(px-5,py+8,13);tree(px+6,py+15,10);ctx.fillStyle='#c6c49c';ctx.fillRect(px-4,py+15,7,2);}
  else if(t.type==='power'){block(px,pyc+3,12,6,14,'#aab9b7','#7b9591','#5d7a7e');block(px+6,pyc-2,3,2,28,'#d1d1bd','#8b9691','#637b7e');ctx.fillStyle='#ffe3a3';ctx.font='bold 15px sans-serif';ctx.fillText('ϟ',px-5,pyc-6);}
  else if(t.type==='water'){block(px,pyc,7,4,19,'#b9ddd6','#7daaa8','#648f91');ctx.fillStyle='#addbdf';ctx.beginPath();ctx.ellipse(px,pyc-19,7,4,0,0,Math.PI*2);ctx.fill();}
  else{let colors=t.type==='fire'?['#e4b4a0','#bd8577','#9f7066']:t.type==='clinic'?['#dce4df','#a5c8bd','#7fafa5']:['#eadca9','#c7b788','#a5976f'];block(px,pyc,12,6,15,...colors);ctx.fillStyle=t.type==='clinic'?'#4d9c89':'#f6e7c6';ctx.font='bold 11px sans-serif';ctx.fillText(t.type==='clinic'?'✚':t.type==='fire'?'F':'S',px-6,pyc-4);}
  if(t.damage){ctx.fillStyle='#ff9c58';ctx.font='bold 16px sans-serif';ctx.fillText('!',px-4,pyc-20);diamond(px,py+1,'#ed704b80');}else if(t.power<.8||t.water<.8||city.access[i]<0){ctx.fillStyle='#eec079';ctx.beginPath();ctx.arc(px+11,py+4,3,0,Math.PI*2);ctx.fill();}
  }else if(t.terrain==='forest'){tree(px-3,py+12,12+(hash%4));if(hash%3===0)tree(px+8,py+15,8);}
  if(overlay!=='normal'){let value=null;if(overlay==='traffic'&&['road','bridge'].includes(t.type))value=Math.min(1,city.traffic[i]/(60*city.funding.roads/100*2));if(overlay==='pollution')value=city.pollution(i)/100;if(['power','water'].includes(overlay)&&t.type){let c=city.components[['road','bridge'].includes(t.type)?city.comp[i]:city.access[i]];value=c?1-Math.min(1,c[overlay]/Math.max(1,c[overlay==='power'?'demandP':'demandW'])):1;}if(overlay==='fire'&&t.type&&!['road','bridge'].includes(t.type))value=1-city.service(i,'fire');if(overlay==='happiness'&&t.type==='residential')value=1-(t.happiness||0)/100;if(value!==null)diamond(px,py+1,`rgba(${Math.round(70+value*180)},${Math.round(190-value*110)},100,.57)`);}
  if(i===selected||i===hover){ctx.lineWidth=i===selected?2:1.5;ctx.strokeStyle=i===hover?'#e4ffd5':'#ffe5a0';ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+20,py+10);ctx.lineTo(px,py+20);ctx.lineTo(px-20,py+10);ctx.closePath();ctx.stroke();if(i===hover&&tool!=='inspect'&&!t.type)diamond(px,py+1,(TYPES[tool]?.color||'#c6e8d7')+'55');}
 }
 ctx.restore();ctx.fillStyle='#c5e2d680';ctx.font='10px sans-serif';ctx.fillText('N ↗',20,ch-106);
 if(overlay!=='normal'){ctx.fillStyle='#142b32e8';ctx.fillRect(17,56,176,29);ctx.font='10px sans-serif';ctx.fillStyle='#79d891';ctx.fillText(overlay==='traffic'?'● 畅通':'● 充足 / 低污染',27,75);ctx.fillStyle='#f3a077';ctx.fillText(overlay==='traffic'?'● 拥堵':'● 不足 / 高污染',112,75);}
}
function tree(x,y,h){ctx.fillStyle='#6b6c4e';ctx.fillRect(x-1,y-5,2,7);polygon([[x,y-h-5],[x+6,y-4],[x-6,y-4]],'#365f4e');polygon([[x,y-h-5],[x,y-4],[x-6,y-4]],'#477e5b');}
function windows(x,y,levels,color){ctx.fillStyle=color;for(let k=0;k<levels;k++)for(let j=0;j<2;j++)ctx.fillRect(x+2+j*4,y-9-k*9-j*2,2,3);}
function frame(now){if(now-lastRender>33){render(now);lastRender=now;}if(!paused&&!$('modal').open&&now-lastTick>=3000/speed){lastTick=now;try{advance();}catch(e){paused=true;updatePause();toast('模拟发生错误：'+e.message);console.error(e);}}requestAnimationFrame(frame);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();lastTick=performance.now();});window.addEventListener('beforeunload',()=>persist());
window.cityGame={get city(){return city;},advance,setTool,project,select:i=>{selected=i;inspect();},get paused(){return paused;}};
updatePause();setTool('inspect');update();requestAnimationFrame(frame);
let hasSave=false;try{hasSave=!!localStorage.getItem('riverbend-v1');}catch(e){}if(!hasSave){showModal('欢迎来到江湾市',`<div class="eyebrow">A CITY IS MORE THAN ITS BUILDINGS</div><p style="font-size:18px;color:#e1efe7;margin:10px 0 17px">从一条道路，到一座生生不息的城市。</p><p>你的起步小镇已有道路、水电和第一批居民。规划新的住宅与岗位，让这片河湾成为宜居家园。</p><p>用道路连接建筑，平衡水电、工作和财政。城市按月发展，随时可以暂停规划。四个经营目标完成后，仍能继续建设。</p><div class="modal-actions"><button id="begin" class="primary">开始经营 →</button><button id="welcomeGuide">阅读市长手册</button></div><p class="muted">无需账号 · 离线运行 · 自动保存</p>`);$('begin').onclick=()=>{paused=false;updatePause();closeModal();};$('welcomeGuide').onclick=()=>showModal('市长手册',guide);}
})();
</script>
